<script>
function orderOnWhatsApp(productName, price, phoneNumber) {
  const currentUrl = window.location.href;
  const message = `হ্যালো "ময়নামতি শাড়ি ঘর", আমি এই শাড়িটি অর্ডার করতে চাই:\n\n` +
                  `📌 *প্রোডাক্ট:* ${productName}\n` +
                  `💰 *মূল্য:* ৳${price}\n` +
                  `🔗 *লিংক:* ${currentUrl}\n\n` +
                  `অনুগ্রহ করে ডেলিভারি প্রক্রিয়াটি নিশ্চিত করুন।`;
  
  const encodedMessage = encodeURIComponent(message);
  window.open(`https://wa.me/88${phoneNumber}?text=${encodedMessage}`, '_blank');
}
</script>
